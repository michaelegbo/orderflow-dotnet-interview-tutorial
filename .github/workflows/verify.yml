name: Verify every OrderFlow stage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  end-to-end:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify all 176 ordered lesson states
        shell: pwsh
        run: ./scripts/verify-lesson-history.ps1

      - name: Restore and verify every exact lesson checkpoint
        shell: pwsh
        run: ./scripts/verify-checkpoints.ps1

      - name: Verify the published Pages bundle and download
        shell: pwsh
        run: node ./scripts/verify-site.mjs
